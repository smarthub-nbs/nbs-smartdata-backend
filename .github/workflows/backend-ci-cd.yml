name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Optional Render environment to deploy after CI passes"
        required: true
        default: none
        type: choice
        options:
          - none
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: backend-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django Checks And Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smarthub
          POSTGRES_USER: smarthub
          POSTGRES_PASSWORD: smarthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smarthub -d smarthub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: src

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: github-actions-test-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: smarthub
      DB_USER: smarthub
      DB_PASSWORD: smarthub
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "0"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      CELERY_TASK_ALWAYS_EAGER: "True"
      CELERY_TASK_EAGER_PROPAGATES: "True"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('src/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install test dependencies
        run: uv sync --frozen --no-default-groups --group test

      - name: Check Django configuration
        run: uv run python manage.py check --settings=config.settings.test

      - name: Validate OpenAPI schema
        run: uv run python manage.py spectacular --validate --file /tmp/schema.yml --settings=config.settings.test

      - name: Run tests
        run: uv run python manage.py test --settings=config.settings.test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file Dockerfile --tag smarthub-backend:${{ github.sha }} .

  deploy-staging:
    name: Deploy Staging To Render
    runs-on: ubuntu-latest
    needs:
      - test
      - docker-build
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment == 'staging')

    env:
      RENDER_WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_WEB_DEPLOY_HOOK_URL }}
      RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_WORKER_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render staging deploy hooks
        run: |
          trigger_hook() {
            service_name="$1"
            hook_url="$2"

            if [ -z "$hook_url" ]; then
              echo "Skipping ${service_name}: deploy hook secret is not configured."
              return 0
            fi

            echo "Triggering ${service_name} deploy."
            curl --fail --silent --show-error --request POST "$hook_url"
            echo
          }

          trigger_hook "staging web service" "$RENDER_WEB_DEPLOY_HOOK_URL"
          trigger_hook "staging celery worker" "$RENDER_WORKER_DEPLOY_HOOK_URL"

  deploy-production:
    name: Deploy Production To Render
    runs-on: ubuntu-latest
    needs:
      - test
      - docker-build
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment == 'production')

    env:
      RENDER_WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_WEB_DEPLOY_HOOK_URL }}
      RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_WORKER_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render production deploy hooks
        run: |
          trigger_hook() {
            service_name="$1"
            hook_url="$2"

            if [ -z "$hook_url" ]; then
              echo "Skipping ${service_name}: deploy hook secret is not configured."
              return 0
            fi

            echo "Triggering ${service_name} deploy."
            curl --fail --silent --show-error --request POST "$hook_url"
            echo
          }

          trigger_hook "production web service" "$RENDER_WEB_DEPLOY_HOOK_URL"
          trigger_hook "production celery worker" "$RENDER_WORKER_DEPLOY_HOOK_URL"
