name: smarthub-production

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_REPOSITORY:-smarthub-backend}:${IMAGE_TAG:-local}
    env_file:
      - path: .env.production
        required: true
        format: raw
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      PORT: "8000"
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - ${WEB_WORKERS:-3}
      - --timeout
      - ${WEB_TIMEOUT_SECONDS:-120}
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    volumes:
      - static_data:/app/src/config/staticfiles:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_REPOSITORY:-smarthub-backend}:${IMAGE_TAG:-local}
    env_file:
      - path: .env.production
        required: true
        format: raw
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - info
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_REPOSITORY:-smarthub-backend}:${IMAGE_TAG:-local}
    env_file:
      - path: .env.production
        required: true
        format: raw
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    command:
      - python
      - manage.py
      - migrate
      - --noinput
    profiles:
      - release
    volumes:
      - static_data:/app/src/config/staticfiles
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  collectstatic:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_REPOSITORY:-smarthub-backend}:${IMAGE_TAG:-local}
    env_file:
      - path: .env.production
        required: true
        format: raw
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    command:
      - python
      - manage.py
      - collectstatic
      - --noinput
    profiles:
      - release
    volumes:
      - static_data:/app/src/config/staticfiles
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

volumes:
  static_data:
